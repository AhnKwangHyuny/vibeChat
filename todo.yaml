        description: HikariCP/Redis 캐시 설정
        type: modify
    subtasks:
      - id: fe-virtualization
        title: 리스트 가상화
        description: 스크롤 성능 최적화
        category: ui
        implementation_notes:
          - 시야 아이템만 렌더
      - id: be-cache-tuning
        title: 태그/검색 캐시
        description: cache:* 키 TTL 설정 활성화
        category: core
        implementation_notes:
          - 캐시 미스 로깅
    dependencies:
      - frontend-chat-ui
      - backend-room-tag-api
    completion_criteria:
      - 100 동시 연결에서 p95 ≤ 1s(로컬) 지표 확보
      - CPU ≤ 70% 가이드 충족(관찰)
    risks:
      - risk: 측정 편차 큼
        mitigation: 여러 번 측정 평균/표준편차 기록
    order: 28
  - id: qa-scenario-tests
    title: 시나리오(E2E 대체) 점검
    priority: P0
    description: "A: 닉네임→태그 검색→입장→텍스트 전송, B: 비공개 방 생성→초대 코드 입장, C: 업로드→미리보기→전송, D: 신고 3스텝. 수동/스크립트화 점검."
    files:
      - path: docs/DEMO_CHECKLIST.md
        description: 시나리오 체크리스트
        type: create
    subtasks:
      - id: scenario-run
        title: 시나리오 실행
        description: 각 플로우 성공/실패 케이스 확인
        category: test
        implementation_notes:
          - 브라우저 2개 동시 검증
    dependencies:
      - docs-and-scripts
      - frontend-upload-ui
    completion_criteria:
      - P0 플로우 전부 Green
      - 초기 진입→첫 메시지 ≤ 60s
    risks:
      - risk: 사전 조건 누락
        mitigation: 체크리스트에 초기화 절차 포함
    order: 29
implementation_guides:
  - id: rest-error-handling
    title: RFC7807 에러 응답 표준화
    category: 아키텍처
    content: 모든 4xx/5xx 응답은 application/problem+json 형식으로 반환한다. 필드 검증 오류 시 field, message 배열 포함. 클라이언트는 status/title/detail와
      함께 toast에 표시한다.
    related_tasks:
      - backend-auth-guest
      - backend-room-tag-api
      - backend-message-core
      - backend-report-api
      - frontend-error-handling
  - id: cursor-pagination
    title: 커서 기반 페이지네이션 규약
    category: 데이터처리
    content: beforeId 커서를 사용한다. 쿼리는 created_at DESC, id < beforeId 조건으로 30개(최대 50). 응답은 오래된 항목이 앞서도록 클라이언트에서 역순 정렬한다.
    related_tasks:
      - backend-message-core
      - frontend-chat-ui
  - id: stomp-reconnect
    title: STOMP 재연결/전송 큐 패턴
    category: 성능
    content: 연결 끊김 시 1s→2s→4s→... 최대 10s 백오프. 연결 전 전송 요청은 큐잉하여 연결 후 플러시. 구독은 재연결 시 재등록한다.
    related_tasks:
      - frontend-ws-client
      - frontend-chat-ui
  - id: redis-keys
    title: Redis 키 네이밍/TTL
    category: 데이터처리
    content: presence:room:{roomId}:sessions, presence:session:{stompSessionId}(TTL 1h), typing:room:{roomId}(TTL 3s),
      cache:tags:prefix:{q}(TTL 5m), cache:rooms:search:{tagsHash}(TTL 1m), rl:msg:{userId}:{roomId},
      nickname:room:{roomId}.
    related_tasks:
      - backend-presence-typing
      - backend-room-tag-api
      - backend-message-core
  - id: rate-limit-bucket4j
    title: Bucket4j 레이트 제한 적용
    category: 보안
    content: 메시지 전송은 20/min, 버스트 10. 키는 userId+roomId 기준. 초과 시 429와 retryAfterSeconds를 problem+json으로 반환.
    related_tasks:
      - backend-message-core
      - frontend-error-handling
  - id: file-upload-safety
    title: 파일 업로드 안전 규약
    category: 보안
    content: 확장자 불신, Tika로 MIME 확인. UUID 파일명 사용, /var/www/uploads 하위에만 저장. 이미지 썸네일은 512px, GIF는 첫 프레임, 비디오는 FFmpeg probe로 길이
      확인 후 1초 포스터.
    related_tasks:
      - backend-upload-api
      - infra-nginx-config
      - frontend-upload-ui
  - id: csrf-double-submit
    title: CSRF 더블 서밋 전략(REST)
    category: 보안
    content: 서버는 CSRF 토큰을 쿠키에 설정하고 클라이언트는 동일 값을 헤더로 전송. WebSocket은 오리진 검증으로 보호.
    related_tasks:
      - backend-build-init
      - frontend-setup
  - id: dto-mapping-modelmapper
    title: ModelMapper DTO 매핑 표준
    category: 아키텍처
    content: 단방향 DTO→Entity/Entity→DTO 매핑 규칙을 명시하고, N+1 방지를 위해 필요한 필드만 매핑한다. 사용자 노출 DTO에는 민감 정보 제외.
    related_tasks:
      - backend-room-tag-api
      - backend-message-core
execution_order:
  summary: 7일 내 MVP 달성을 위해 Day1 인프라/데이터 기초 → Day2 도메인/REST → Day3 WS/실시간 → Day4~5 프론트 핵심 UX → Day6 업로드/보관/테스트 → Day7
    문서/성능/데모 검증 순으로 진행한다. 모든 P0 기능은 Day5 이전에 통합 테스트 가능 상태를 목표로 한다.
  phases:
    - phase_name: Day 1 — 기반 설정/데이터
      task_ids:
        - setup-monorepo
        - infra-docker-compose
        - backend-build-init
        - data-flyway-er
        - backend-entity-repo
      description: 모노레포/컴포즈/백엔드 보일러플레이트와 스키마/엔티티를 완료하여 빌드 및 기동이 가능하도록 한다.
    - phase_name: Day 2 — 도메인 REST 구축
      task_ids:
        - backend-auth-guest
        - backend-room-tag-api
        - backend-join-room
      description: 게스트 등록, 방 생성/조회/검색, 참가 API 구현. Swagger에서 기본 플로우 점검.
    - phase_name: Day 3 — 실시간 채팅 백엔드
      task_ids:
        - backend-ws-config
        - backend-presence-typing
        - backend-message-core
        - backend-report-api
      description: WebSocket/STOMP, presence/typing, 메시지 저장/브로드캐스트, 신고까지 백엔드 실시간 기능 완성.
    - phase_name: Day 4 — 프론트 기반/검색/입장
      task_ids:
        - frontend-setup
        - frontend-rooms-search
        - frontend-auth-guest-nickname
        - frontend-room-create-join
      description: 프론트 초기화와 홈/검색/방 생성/참여 UX 구현.
    - phase_name: Day 5 — 채팅 UX/페이징
      task_ids:
        - frontend-ws-client
        - frontend-chat-ui
      description: WS 클라이언트, 채팅 리스트/입력/전송/페이징 및 pending→sent 상태 구현. 기본 P0 실시간 KPI 충족.
    - phase_name: Day 6 — 업로드/보관/테스트
      task_ids:
        - backend-upload-api
        - backend-scheduler-trim
        - backend-tests
        - frontend-upload-ui
        - frontend-presence-typing
        - frontend-error-handling
      description: 업로드 백엔드/프론트, 메시지 보관 트림, 테스트 스위트, 타이핑/온라인/에러 UX 추가.
    - phase_name: Day 7 — 문서/성능/데모
      task_ids:
        - infra-nginx-config
        - docs-and-scripts
        - perf-optimizations
        - fe-darkmode-skeleton-404
        - qa-scenario-tests
      description: Nginx 최종화, 문서 완성, 성능 튜닝, 보조 UX(P2), 데모 시나리오 점검으로 마감.
