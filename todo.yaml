    demo_features:
      - ✅ 완전한 데모 환경 (/room/demo)
      - ✅ 백엔드 독립적 동작
      - ✅ 모든 채팅 기능 시뮬레이션
      - ✅ 자동 응답 시스템
      - ✅ 상호작용 가능한 컴포넌트 쇼케이스
tasks:
  - id: setup-monorepo
    title: 모노레포 구조 및 기본 환경 설정
    priority: P0
    description: 프로젝트 루트/백엔드/프론트엔드/인프라 디렉터리 생성, 공통 .env.example 배치, README 스켈레톤 추가. Git ignore, 라이선스/에디터 설정 포함. Docker 기반 로컬
      실행을 위한 기본 전제 구성.
    files:
      - path: backend/Dockerfile
        description: Spring Boot 3.3.x 백엔드 컨테이너 빌드 스크립트(Temurin 21, FFmpeg 설치 포함)
        type: create
      - path: frontend/Dockerfile
        description: React 18 + Vite 프런트엔드 빌드/서빙 컨테이너 스크립트
        type: create
      - path: infra/docker-compose.yml
        description: nginx, backend, frontend, mysql, redis, 볼륨/네트워크 선언
        type: create
      - path: .env.example
        description: 백엔드/프론트 환경변수 템플릿
        type: create
      - path: README.md
        description: 프로젝트 개요/실행 방법/구조 문서 스켈레톤
        type: create
    subtasks:
      - id: setup-monorepo-structure
        title: 폴더 구조 생성
        description: backend/, frontend/, infra/{nginx,db,scripts}/, docs/ 디렉터리와 기본 파일 배치
        category: setup
        implementation_notes:
          - 루트 수준 .gitignore에 node_modules, build, target, .idea, .vscode, dist, uploads 제외 설정
          - 문서 디렉터리 프레임 추가(ERD.md, API.md, WEBSOCKET.md, REPORTING.md)
      - id: setup-monorepo-env
        title: .env.example 작성
        description: TRD의 환경변수를 모두 포함한 예시 파일 제공 및 주석 설명
        category: setup
        implementation_notes:
          - "Backend: SPRING_DATASOURCE_URL 등 기본값 설정"
          - "Frontend: VITE_API_BASE, VITE_WS_URL 기본값 설정"
      - id: setup-monorepo-readme
        title: README 스켈레톤
        description: 실행 개요, 기술 스택, 디렉터리 구조, 빠른 시작 섹션 추가
        category: setup
        implementation_notes:
          - docker-compose up 단일 명령 강조
          - 문서 링크 자리표시자 추가
    completion_criteria:
      - 루트에 정의된 디렉터리와 파일이 모두 존재
      - docker-compose.yml 구문 유효성 검사 통과
      - .env.example 변수 목록이 TRD 25항목과 일치
    risks:
      - risk: 로컬 포트 충돌
        mitigation: docker-compose 포트 매핑 환경변수화 및 기본 포트 가용성 체크
      - risk: 플랫폼 간 경로/권한 문제
        mitigation: 볼륨 마운트에 대한 uid/gid 주석 및 Windows/WSL2 가이드 추가
    order: 1

  - id: infra-docker-compose
    title: Docker Compose 서비스 구성
    priority: P0
    status: completed
    description: nginx, backend, frontend, mysql, redis, 볼륨 및 네트워크 정의
    order: 2
  - id: infra-docker-compose
    title: Docker Compose 서비스 구성
    priority: P0
    description: nginx, backend, frontend, mysql, redis, 볼륨(mysql-data, redis-data, uploads, frontend-dist) 및 네트워크(vibechat)
      정의. 업로드 경로와 정적 파일 서빙 볼륨 마운트.
    files:
      - path: infra/docker-compose.yml
        description: 서비스/볼륨/네트워크 정의
        type: modify
      - path: infra/nginx/nginx.conf
        description: /, /api, /ws, /uploads 라우팅 및 업그레이드 헤더 유지 설정
        type: create
    subtasks:
      - id: compose-services
        title: 서비스 정의
        description: 5개 서비스와 종속성(wait-for) 설정, 환경변수 전달
        category: deploy
        implementation_notes:
          - nginx가 frontend-dist 볼륨을 읽어 정적 서빙
          - /ws 업그레이드 헤더와 proxy_http_version 1.1 설정
      - id: compose-volumes
        title: 볼륨/네트워크 구성
        description: mysql-data, redis-data, uploads, frontend-dist 영속 볼륨 정의
        category: deploy
        implementation_notes:
          - uploads 볼륨을 nginx 컨테이너 /var/www/uploads로 마운트
          - backend 컨테이너에도 동일 경로 마운트
    dependencies:
      - setup-monorepo
    completion_criteria:
      - docker-compose config 성공
      - nginx 컨테이너가 /uploads 정적 서빙 응답 200
      - 모든 컨테이너가 동일 네트워크에서 통신 가능
    risks:
      - risk: nginx 업그레이드 헤더 누락으로 WS 실패
        mitigation: Upgrade, Connection 헤더와 proxy_set_header 정의 체크리스트 포함
      - risk: 볼륨 권한 오류
        mitigation: uploads 디렉터리 755 권한 및 사용자 매핑 가이드 제공
    order: 2
  - id: backend-build-init
    title: 백엔드 빌드/의존성 초기화 및 보일러플레이트
    priority: P0
    description: Spring Boot 3.3.x(Java 21) 프로젝트 초기화, 의존성 추가(Web, Security, JPA, WebSocket, Validation, Redis, Spring
      Session, flyway, modelmapper, jackson, tika, thumbnailator, bucket4j-redis, owasp sanitizer, springdoc-openapi,
      lombok). Actuator 활성. 기본 패키지/구성 클래스 생성.
    files:
      - path: backend/src/main/resources/application.yml
        description: DB/Redis/세션/로그/Swagger/업로드 경로/레이트 제한 환경변수 바인딩
        type: create
      - path: backend/pom.xml
        description: Maven 빌드 도구 의존성 정의
        type: create
      - path: backend/src/main/java/com/vibechat/config/SecurityConfig.java
        description: 세션 기반 보안, CSRF 설정, WebSocket Origin 허용
        type: create
      - path: backend/src/main/java/com/vibechat/config/SwaggerConfig.java
        description: springdoc-openapi UI 설정
        type: create
      - path: backend/src/main/java/com/vibechat/config/RedisConfig.java
        description: Redis 연결 및 Template/Cache 설정
        type: create
      - path: backend/src/main/java/com/vibechat/config/ModelMapperConfig.java
        description: ModelMapper 매핑 전략 설정
        type: create
      - path: backend/src/main/java/com/vibechat/config/ValidationConfig.java
        description: Validator Bean 설정
        type: create
    subtasks:
      - id: backend-deps
        title: 의존성 선언
        description: pom.xml에 TRD 명시 라이브러리 추가
        category: setup
        implementation_notes:
          - spring-boot-starter-web, data-jpa, security, websocket, validation
          - spring-session-data-redis, springdoc-openapi-starter-ui
      - id: backend-actuator
        title: Actuator 활성화
        description: /actuator/health 노출 및 보안 범위 지정
        category: setup
        implementation_notes:
          - 관리 엔드포인트 노출 기반은 최소화(health만)
      - id: backend-logging
        title: JSON 로깅/MDC
        description: Logback JSON 패턴, 요청 correlationId 필터
        category: setup
        implementation_notes:
          - MDC 필터로 요청 ID 주입
          - 에러시 스택/컨텍스트 포함
    dependencies:
      - infra-docker-compose
    completion_criteria:
      - mvn -q -DskipTests package 성공
      - /actuator/health 200 응답
      - Swagger UI 로딩 성공(/swagger-ui.html)
    risks:
      - risk: 의존성 충돌
        mitigation: Spring Boot BOM 사용 및 버전 고정
      - risk: CORS/CSRF 오구성
        mitigation: 개발 프로필에서 허용 오리진과 CSRF 더블 서밋 헤더 문서화
    order: 3

  - id: data-flyway-er
    title: ERD 마이그레이션 및 인덱스 구현(Flyway)
    priority: P0
    status: pending
    description: TRD 4항 ERD와 인덱싱 전략을 Flyway 스크립트로 구현
    requirements:
      - users, chat_rooms, tags, room_tags, messages, message_reports 테이블 생성
      - 적절한 인덱스 설정 (messages(room_id, created_at DESC), tags(name prefix))
    files:
      - backend/src/main/resources/db/migration/V1__init_schema.sql
    order: 4

  - id: backend-entity-repo
    title: JPA 엔티티/리포지토리 정의
    priority: P0
    status: pending
    description: ERD에 따른 엔티티 및 리포지토리 인터페이스 구현
    requirements:
      - User, ChatRoom, Tag, RoomTag, Message, MessageReport 엔티티
      - 검색/페이지네이션/카운트 기본 메서드
    files:
      - backend/src/main/java/com/vibechat/domain/*
      - backend/src/main/java/com/vibechat/repository/*
    order: 5

  - id: backend-auth-guest
    title: 게스트 사용자 생성 API
    priority: P0
    status: pending
    description: 세션 기반 게스트 닉네임 등록, 중복 검사, 세션 쿠키 인증
    requirements:
      - POST /api/users/guest 엔드포인트
      - 닉네임 검증 (@NotBlank, @Size)
      - Spring Session Redis 저장
      - RFC7807 에러 포맷
    files:
      - backend/src/main/java/com/vibechat/controller/AuthController.java
      - backend/src/main/java/com/vibechat/service/UserService.java
    api_integration:
      frontend_hook: useAuth
      frontend_component: NicknameModal
    order: 6

  - id: backend-room-tag-api
    title: 방 생성/조회/검색 및 태그 자동완성 API
    priority: P0
    status: pending
    description: RoomService/TagService 구현, 방 생성/조회/검색, 태그 자동완성
    requirements:
      - POST /api/rooms (방 생성)
      - GET /api/rooms/{id} (방 상세)
      - GET /api/rooms/search (태그 기반 검색)
      - GET /api/tags/autocomplete (자동완성)
      - Redis 캐시 적용 (검색: TTL 1m, 태그: TTL 5m)
    files:
      - backend/src/main/java/com/vibechat/service/RoomService.java
      - backend/src/main/java/com/vibechat/service/TagService.java
      - backend/src/main/java/com/vibechat/controller/RoomController.java
      - backend/src/main/java/com/vibechat/controller/TagController.java
    api_integration:
      frontend_hook: useRooms
      frontend_pages: [Home, CreateRoom, RoomList]
      frontend_components: [SearchBar, RoomCard, RoomListCard]
    order: 7

  - id: backend-join-room
    title: 방 참가 API(공개/비공개)
    priority: P0
    status: pending
    description: 닉네임 중복 방지, 초대 코드 검증, 제안 닉네임 반환
    requirements:
      - POST /api/rooms/{roomId}/join
      - 닉네임 중복 체크 (Redis SET 사용)
      - 초대 코드 검증 (비공개 방)
      - 409 에러 시 제안 닉네임 제공
    files:
      - backend/src/main/java/com/vibechat/controller/RoomController.java (modify)
      - backend/src/main/java/com/vibechat/service/RoomService.java (modify)
    api_integration:
      frontend_pages: [Room, RoomDemo]
      frontend_components: [Navbar]
    order: 8

  - id: backend-ws-config
    title: WebSocket/STOMP 설정 및 보안
    priority: P0
    status: pending
    description: /ws 엔드포인트, SockJS, SimpleBroker, 보안 설정
    requirements:
      - /ws STOMP 엔드포인트
      - SockJS 폴백 지원
      - SimpleBroker(/topic) + /app 프리픽스
      - 하트비트 10000/10000
      - 오리진 화이트리스트 검증
    files:
      - backend/src/main/java/com/vibechat/websocket/WebSocketConfig.java
      - backend/src/main/java/com/vibechat/websocket/StompEventListener.java
    frontend_integration:
      frontend_service: stompClient.ts
    order: 9

  - id: backend-presence-typing
    title: Presence/Typing Redis 연동 및 브로드캐스트
    priority: P0
    status: pending
    description: 입장/퇴장 시 presence 세트 갱신, 타이핑 이벤트 처리
    requirements:
      - presence:room:{roomId}:sessions Redis SET 관리
      - typing:room:{roomId} SET (TTL 3s)
      - /topic/rooms/{roomId}/presence 브로드캐스트
      - /topic/rooms/{roomId}/typing 브로드캐스트
    files:
      - backend/src/main/java/com/vibechat/service/PresenceService.java
    order: 10

  - id: backend-message-core
    title: 메시지 저장/브로드캐스트 및 레이트 제한
    priority: P0
    status: pending
    description: 메시지 전송/저장/브로드캐스트, XSS 정제, 레이트 제한
    requirements:
      - /app/rooms/{roomId}/send STOMP 핸들러
      - XSS 정제 (OWASP HTML Sanitizer)
      - Bucket4j 레이트 제한 (20/min, 버스트 10)
      - clientTempId 포함 브로드캐스트
      - GET /api/rooms/{roomId}/messages (커서 페이징)
    files:
      - backend/src/main/java/com/vibechat/controller/ChatWsController.java
      - backend/src/main/java/com/vibechat/service/MessageService.java
      - backend/src/main/java/com/vibechat/controller/MessageController.java
    order: 11

  - id: backend-report-api
    title: 신고 API 구현
    priority: P0
    status: pending
    description: 메시지 신고 기능, 중복 방지, 감사 로그
    requirements:
      - POST /api/messages/{messageId}/report
      - 중복 신고 방지
      - 감사 로그 기록
      - reason enum, details 길이 제한
    files:
      - backend/src/main/java/com/vibechat/controller/ReportController.java
      - backend/src/main/java/com/vibechat/service/ReportService.java
    order: 12

  - id: backend-upload-api
    title: 미디어 업로드 API(검증/저장/썸네일/FFmpeg)
    priority: P1
    status: pending
    description: 파일 업로드, MIME 검증, 썸네일 생성, 비디오 처리
    requirements:
      - POST /api/upload/media
      - Apache Tika MIME 검증
      - 크기 제한 (최대 20MB)
      - 이미지 썸네일 (512px)
      - GIF 첫 프레임 썸네일
      - MP4 길이 검증 (≤10s) 및 포스터 추출
      - UUID 파일명, 경로 트래버설 방지
    files:
      - backend/src/main/java/com/vibechat/controller/UploadController.java
      - backend/src/main/java/com/vibechat/service/UploadService.java
    order: 13

  - id: backend-scheduler-trim
    title: 메시지 보관 트림 스케줄러
    priority: P0
    status: pending
    description: 방별 최근 1,000개 메시지만 유지하는 스케줄러
