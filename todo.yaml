project:
  name: Vibe Chat — 7일 MVP (Spring Boot 3.x + React 18 + TypeScript)
  description: 실시간 채팅(텍스트/이미지/GIF/≤10초 영상), 태그 기반 검색, 신고, 기본 인증(게스트/구글[P1]), Redis 캐싱/세션, MySQL 영속화, Docker 기반 로컬 데모를 7일 내
    구현하기 위한 결정론적 작업 계획 및 검증 기준 정의.

