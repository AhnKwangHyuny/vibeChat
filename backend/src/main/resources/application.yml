# 데이터소스 (MySQL)
spring:
  datasource:
    # 환경변수 없을 때 로컬 기본값으로 연결되도록 기본값 제공
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vibechat?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:                     # HikariCP 커넥션 풀 설정
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 600000

  jpa:                         # JPA/Hibernate 설정
    hibernate:
      ddl-auto: create       # 로컬 개발: 스키마 자동 생성/업데이트 (배포/CI는 validate+Flyway 권장)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  servlet: # 파일 업로드(멀티파트)
    multipart:
      # 환경변수가 없을 때 기본 20MB로 동작하도록 기본값 제공
      max-file-size: ${MEDIA_MAX_UPLOAD_MB:20}MB
      max-request-size: ${MEDIA_MAX_UPLOAD_MB:20}MB

  data:                        # Redis 설정
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  session:                     # Spring Session (Redis)
    store-type: redis
    redis:
      flush-mode: on_save

  cache:                       # Spring Cache (Redis)
    type: redis

  flyway:                      # 데이터베이스 마이그레이션(Flyway)
    enabled: false            # 로컬 비활성 (배포/CI에서 true)
    baseline-on-migrate: true

  security:                    # OAuth2 클라이언트(Google)
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

# 애플리케이션 전용 설정
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

media:
  upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
  max-video-seconds: ${MEDIA_MAX_VIDEO_SECONDS:10}
  ffmpeg:
    path: ${FFMPEG_PATH:/usr/local/bin/ffmpeg}
  ffprobe:
    path: ${FFPROBE_PATH:/usr/local/bin/ffprobe}

# Springdoc(OpenAPI) 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 로깅 설정
logging:
  level:
    com.vibechat: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/vibechat.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 7

# 액추에이터(헬스체크 등)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Supabase Configuration
supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  anon-key: ${SUPABASE_ANON_KEY}

# 서버 설정 (개발환경 전용)
server:
  servlet:
    session:
      cookie:
        # lax: 같은 사이트와 top-level navigation에서 쿠키 전송 허용
        same-site: lax

        # HTTP 연결에서도 쿠키 전송 허용 (개발환경 전용)
        # 운영환경에서는 true로 설정 필요
        secure: false
        
        # 쿠키 도메인 설정 (개발환경에서 localhost 문제 해결)
        # domain: localhost  # 주석 처리 - 브라우저가 자동으로 도메인 처리하도록 함

        # JavaScript에서 쿠키 접근 차단 (XSS 방어)
        http-only: false

        # 쿠키 유효 경로
        path: /

        # 쿠키 최대 생명주기 (30분 = 1800초)
        max-age: 1800

      # 세션 타임아웃 (30분 = 1800초)
      timeout: 1800

  # 톰캣 설정
  tomcat:
    # URI 인코딩
    uri-encoding: UTF-8
    # 최대 HTTP 헤더 크기
    max-http-header-size: 8KB

