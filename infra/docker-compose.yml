version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - frontend-dist:/var/www/html
      - uploads:/var/www/uploads
    depends_on:
      - backend
      - frontend
    networks:
      - vibechat

  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    depends_on:
      - mysql
      - redis
    volumes:
      - uploads:/var/www/uploads
    networks:
      - vibechat

  frontend:
    build:
      context: ../frontend
      target: base # Use the base stage for development with hot-reloading
    env_file:
      - ../.env
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app # Mount the source code for hot-reloading
      - frontend-dist:/app/dist
      - /app/node_modules # Anonymous volume to prevent host node_modules from overwriting container's
    networks:
      - vibechat

  mysql:
    image: mysql:8.0
    env_file:
      - ../.env
    environment:
      MYSQL_DATABASE: vibechat
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD} # Use a variable from .env
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vibechat

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vibechat

networks:
  vibechat:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  uploads:
  frontend-dist:
